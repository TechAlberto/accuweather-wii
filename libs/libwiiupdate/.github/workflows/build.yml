name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -j"$(nproc)"
      - name: Host tests
        run: |
          apt-get update && apt-get install -y --no-install-recommends gcc libc6-dev
          make -f tests/Makefile.host CC=gcc build/host_test
          ./build/host_test
      - uses: actions/upload-artifact@v4
        with:
          name: libwiiupdate
          path: |
            lib/libwiiupdate.a
            include/wiiupdate.h
