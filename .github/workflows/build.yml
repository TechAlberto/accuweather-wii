name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build DOL
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install devkitPro packages
        run: |
          /opt/devkitpro/pacman/bin/pacman -Sy --noconfirm --needed \
            libogc libfat-ogc ppc-freetype ppc-libpng ppc-brotli ppc-bzip2 \
            ppc-libjpeg-turbo ppc-zlib zip

      - name: Build mbedTLS, libwiiupdate and libwiiosk
        run: bash tools/build_libs.sh

      - name: Build accuweather-wii.dol
        run: make -j"$(nproc)"

      - name: Package the Homebrew Channel zip
        run: |
          mkdir -p dist/apps/accuweather-wii
          cp accuweather-wii.dol dist/apps/accuweather-wii/boot.dol
          cp meta.xml icon.png README.md PORT_NOTES.md dist/apps/accuweather-wii/
          (cd dist && zip -r ../accuweather-wii.zip apps)

      - uses: actions/upload-artifact@v4
        with:
          name: accuweather-wii
          path: |
            accuweather-wii.dol
            accuweather-wii.zip
            meta.xml
            icon.png
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: accuweather-wii

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            accuweather-wii.zip accuweather-wii.dol \
            --repo "${GITHUB_REPOSITORY}" \
            --title "AccuWeather for Wii ${GITHUB_REF_NAME}" \
            --generate-notes
